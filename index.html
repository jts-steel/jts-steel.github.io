<style>
/* =========================================================
   公司資料都在下面的 HTML 裡，直接改文字與連結即可。
   顏色：白底＋紅＋深灰
   ========================================================= */
:root{
  --red:#B5121B; --red-dark:#8E0E15; --ink:#2A2D31; --gray:#5B6068;
  --line:#E3E4E6; --bg:#FFFFFF; --soft:#F5F5F6;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-text-size-adjust:100%;line-height:1.5;
}
.wrap{max-width:480px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}

/* 抬頭 */
header{
  background:var(--red);color:#fff;
  padding:calc(28px + env(safe-area-inset-top,0px)) 20px 24px;
  position:relative;
}
header::after{ /* 底部深灰細線，呼應名片色帶 */
  content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:var(--ink);
}
.brand{display:flex;align-items:center;gap:14px}
.mark{
  flex:none;width:56px;height:56px;border:2px solid #fff;border-radius:6px;
  display:grid;place-items:center;font-size:30px;font-weight:800;letter-spacing:0;
}
.name{min-width:0}
.name h1{margin:0;font-size:24px;line-height:1.25;font-weight:800;letter-spacing:.04em}
.name .en{margin:4px 0 0;font-size:11.5px;letter-spacing:.06em;opacity:.9;font-weight:600}

/* 營業項目：3 秒看懂 */
.biz{padding:26px 20px 6px}
.biz .label{font-size:12px;color:var(--gray);letter-spacing:.12em;margin:0 0 10px;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.tags li{
  font-size:17px;font-weight:700;color:var(--ink);
  border:1.5px solid var(--ink);border-radius:4px;padding:5px 11px;
}
.tags li.hl{background:var(--ink);color:#fff}

/* 聯絡人 */
.person{padding:22px 20px 4px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.person b{font-size:22px;letter-spacing:.08em}
.person span{font-size:15px;color:var(--gray);font-weight:600}

/* 按鈕 */
.actions{padding:14px 20px 8px;display:grid;gap:12px}
.btn{
  display:flex;align-items:center;gap:14px;text-decoration:none;
  min-height:64px;padding:0 18px;border-radius:10px;font-size:18px;font-weight:700;
  -webkit-tap-highlight-color:transparent;
}
.btn:active{transform:scale(.985)}
.btn:focus-visible{outline:3px solid #F2B705;outline-offset:2px}
.btn svg{flex:none;width:28px;height:28px}
.btn .t{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.btn small{font-size:13px;font-weight:500;opacity:.85}
.btn .arrow{margin-left:auto;opacity:.7;font-size:20px}
.b-red{background:var(--red);color:#fff}
.b-red-o{background:#fff;color:var(--red);border:2px solid var(--red)}
.b-ink{background:var(--ink);color:#fff}
.b-ink-o{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .btn{min-height:56px;font-size:16px;justify-content:center;padding:0 10px;gap:8px}
.grid2 .btn svg{width:22px;height:22px}

/* 公司資料 */
.info{margin:18px 20px 0;border-top:1px solid var(--line)}
.info dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 16px;padding:16px 0;font-size:15px}
.info dt{color:var(--gray);white-space:nowrap}
.info dd{margin:0;min-width:0;word-break:break-all;font-variant-numeric:tabular-nums}
footer{padding:14px 20px 28px;font-size:12px;color:var(--gray);text-align:center}
</style>
</head>
